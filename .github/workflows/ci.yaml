# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: 🏗️🧪🚀 Build, Test and Deploy everything

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  checks: write
  security-events: write

concurrency:
  group: build-test-deploy
  cancel-in-progress: true

jobs:
  node-project:
    uses: ./.github/workflows/part_node_build.yaml
    secrets: inherit
    with:
      project: .

  web-project:
    uses: ./.github/workflows/part_node_build.yaml
    secrets: inherit
    with:
      project: web

  docker-image:
    needs: [node-project, web-project]
    uses: ./.github/workflows/part_docker_build.yaml
    with:
      image_name: dontforget

  image-test:
    needs: [docker-image]
    uses: ./.github/workflows/part_docker_test.yaml
    with:
      artifact_name: ${{ needs.docker-image.outputs.artifact_name }}
      image_name: dontforget
      env_vars: >-
        -e NODE_ENV=production
        -e DATABASE_URL=mongodb://host.docker.internal:27017/dontforget-image-test
        -e SEARXNG_BASE_URL=https://search.lehel.xyz
        -e SEARXNG_TOKEN=ci-dummy
        -e OPENCODE_BASE_URL=https://code.lehel.xyz
        -e OPENCODE_API_KEY=ci-dummy

  image-push:
    needs: [docker-image, image-test]
    secrets: inherit
    uses: ./.github/workflows/part_docker_push_artifact.yaml
    with:
      artifact_name: ${{ needs.docker-image.outputs.artifact_name }}
      image_name: dachrisch/dontforget
      local_image_name: dontforget
