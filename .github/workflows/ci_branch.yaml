# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: 🏗️🧪🍂 Build & Test branches
# https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - "*"

permissions:
  contents: write
  checks: write
  security-events: write

concurrency:
  group: build-test-branch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-project:
    uses: ./.github/workflows/part_node_build.yaml
    secrets: inherit
    with:
      project: .

  web-project:
    uses: ./.github/workflows/part_node_build.yaml
    secrets: inherit
    with:
      project: web

  docker-image:
    needs: [node-project, web-project]
    uses: ./.github/workflows/part_docker_build.yaml
    with:
      image_name: dontforget

  image-test:
    needs: [docker-image]
    uses: ./.github/workflows/part_docker_test.yaml
    with:
      artifact_name: ${{ needs.docker-image.outputs.artifact_name }}
      image_name: dontforget
      env_vars: >-
        -e NODE_ENV=production
        -e DATABASE_URL=mongodb://host.docker.internal:27017/dontforget-image-test
        -e SEARXNG_BASE_URL=https://ci-dummy.invalid
        -e SEARXNG_TOKEN=ci-dummy
        -e OPENCODE_BASE_URL=https://ci-dummy.invalid
        -e OPENCODE_API_KEY=ci-dummy